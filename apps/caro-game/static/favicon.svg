<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Board background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#boardGrad)" stroke="#F59E0B" stroke-width="4" filter="url(#shadow)"/>

  <!-- Grid lines -->
  <line x1="64" y1="20" x2="64" y2="108" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>
  <line x1="20" y1="64" x2="108" y2="64" stroke="#D97706" stroke-width="3" stroke-linecap="round"/>

  <!-- 'X' Piece (Left/Top) -->
  <g stroke="#4F46E5" stroke-width="9" stroke-linecap="round">
    <line x1="32" y1="32" x2="52" y2="52"/>
    <line x1="52" y1="32" x2="32" y2="52"/>
  </g>

  <!-- 'O' Piece (Right/Bottom) -->
  <circle cx="86" cy="86" r="14" fill="none" stroke="#E11D48" stroke-width="8"/>
</svg>
