<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="latchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="20" y="20" width="472" height="472" rx="118" fill="none" stroke="#818CF8" stroke-width="8" stroke-opacity="0.5" />

  <!-- Toolbox Handle -->
  <path d="M 184 136 L 184 92 C 184 74, 202 58, 224 58 L 288 58 C 310 58, 328 74, 328 92 L 328 136" 
        fill="none" stroke="url(#steelGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Toolbox Lid -->
  <path d="M 76 182 C 76 156, 96 136, 122 136 L 390 136 C 416 136, 436 156, 436 182 L 436 226 L 76 226 Z" 
        fill="url(#steelGrad)" />
  <rect x="76" y="210" width="360" height="16" fill="#CBD5E1" />

  <!-- Toolbox Body -->
  <path d="M 76 226 L 436 226 L 436 376 C 436 404, 414 428, 384 428 L 128 428 C 98 428, 76 404, 76 376 Z" 
        fill="#1E293B" />
  <path d="M 76 226 L 436 226 L 436 376 C 436 404, 414 428, 384 428 L 128 428 C 98 428, 76 404, 76 376 Z" 
        fill="none" stroke="#334155" stroke-width="6" />

  <!-- Latches -->
  <rect x="228" y="196" width="56" height="60" rx="10" fill="url(#latchGrad)" />
  <circle cx="256" cy="222" r="7" fill="#78350F" />
  <rect x="251" y="232" width="10" height="16" rx="3" fill="#78350F" />
  <rect x="122" y="208" width="32" height="36" rx="8" fill="url(#latchGrad)" />
  <rect x="358" y="208" width="32" height="36" rx="8" fill="url(#latchGrad)" />

  <!-- Lightning Bolt -->
  <path d="M 268 280 L 222 346 L 254 346 L 242 396 L 294 330 L 262 330 Z" 
        fill="url(#latchGrad)" />

  <!-- Accent circles -->
  <circle cx="156" cy="340" r="14" fill="#38BDF8" />
  <circle cx="156" cy="340" r="24" fill="none" stroke="#38BDF8" stroke-width="5" stroke-opacity="0.6" />
  <circle cx="356" cy="340" r="20" fill="none" stroke="#38BDF8" stroke-width="8" stroke-dasharray="90 35" />
</svg>
